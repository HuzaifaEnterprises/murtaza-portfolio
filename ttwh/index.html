@media(max-width:560px){.inv .two{grid-template-columns:1fr}}

<script>
(function(){
'use strict';
var SB_URL='https://qypzizczwdtrzwgirjns.supabase.co';
var SB_KEY='sb_publishable_CvdCOw8OMt3FP9TPMSxAGA_eovSaV2q';
var sb=supabase.createClient(SB_URL,SB_KEY);
var S={user:null,role:null,name:'',tz:undefined,billing:null,tick:null};
var app=document.getElementById('app');

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function md(src){
  var t=esc(src||''),out=[],mode=null;
  function close(){if(mode==='ul')out.push('</ul>');else if(mode==='ol')out.push('</ol>');else if(mode==='tbl')out.push('</tbody></table></div>');mode=null}
  function inl(l){return l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
  var lines=t.split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(/^\s*\|/.test(line)){
      if(/^\s*\|\s*-+/.test(line))continue;
      var cells=line.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return inl(c.trim())});
      if(mode!=='tbl'){close();out.push('<div class="tblwrap" style="margin:8px 0 14px"><table><thead><tr>'+cells.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr></thead><tbody>');mode='tbl'}
      else out.push('<tr>'+cells.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>');
      continue;
    }
    if(/^\s*[-*] /.test(line)){if(mode!=='ul'){close();out.push('<ul>');mode='ul'}out.push('<li>'+inl(line.replace(/^\s*[-*] /,''))+'</li>');continue}
    if(/^\s*\d+\. /.test(line)){if(mode!=='ol'){close();out.push('<ol>');mode='ol'}out.push('<li>'+inl(line.replace(/^\s*\d+\. /,''))+'</li>');continue}
    close();
    if(/^#{1,3} /.test(line))out.push('<h3>'+inl(line.replace(/^#{1,3} /,''))+'</h3>');
    else if(line.trim()==='')continue;
    else out.push('<p>'+inl(line)+'</p>');
  }
  close();
  return '<div class="md">'+out.join('\n')+'</div>';
}
function fmtDate(d,time){if(!d)return '';var o={year:'numeric',month:'short',day:'numeric',timeZone:S.tz};if(time){o.hour='numeric';o.minute='2-digit'}return new Date(d).toLocaleString('en-CA',o)}
function money(n){return n==null?'TBC':'CAD $'+Number(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2})}
function hms(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function chip(s){return '<span class="chip '+esc(s)+'">'+esc(String(s).replace('_',' '))+'</span>'}
function isAdmin(){return S.role==='admin'}
function note(msg,cls){return '<div class="'+(cls||'err')+'" role="status">'+esc(msg)+'</div>'}
function fail(e){alert('Something went wrong: '+(e&&e.message?e.message:e))}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function must(res){if(res.error)throw res.error;return res.data}
var STAGES=['not_started','in_progress','in_review','done'];
var STAGE_PCT={not_started:0,in_progress:25,in_review:75,done:100};

/* ---------- shell ---------- */
var TABS=[['home','← Programs'],['overview','Overview'],['contracts','Contracts'],['payments','Payments'],['progress','Progress'],['updates','Updates'],['package','Package'],['qa','Q&A']];
function shell(route,html){
  var tabs=TABS.slice();if(isAdmin())tabs.push(['timer','Timer']);
  app.innerHTML='<header class="hero"><div class="wrap"><h1><span class="strip">ttwh</span> <span class="strip" style="transform:rotate(1deg)">package portal</span></h1><p>One private place for the contract, payments, progress and updates '+(route==='home'||route==='rr'?'for each program.':'for the Psychic Training School package.')+'</p></div></header>'
   +'<nav class="tabs" aria-label="Sections"><div class="wrap">'+(route==='home'||route==='rr'?'':tabs.map(function(t){return '<a href="#/'+t[0]+'"'+(route===t[0]?' class="on" aria-current="page"':'')+'>'+t[1]+'</a>'}).join(''))
   +'<button class="btn sm alt" id="logout">Sign out</button></div></nav><main><div class="wrap" id="page">'+html+'</div></main>';
  $('#logout').onclick=function(){S.user=null;S.role=null;sb.auth.signOut().then(function(){history.replaceState(null,'',location.pathname);loginView()},function(){history.replaceState(null,'',location.pathname);loginView()})};
}
function setPage(html){$('#page').innerHTML=html}

/* ---------- auth ---------- */
function loginView(msg){
  app.innerHTML='<header class="hero"><div class="wrap"><h1><span class="strip">ttwh</span> <span class="strip" style="transform:rotate(1deg)">package portal</span></h1><p>Private page. Sign in to continue.</p></div></header><main><div class="wrap"><form class="card login" id="lf"><div class="bar"></div><div class="in">'
   +(msg?note(msg):'')+'<label for="em">Email</label><input id="em" type="email" autocomplete="username" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><p style="margin-top:14px"><button class="btn" type="submit">Sign in</button></p></div></form></div></main>';
  $('#lf').onsubmit=function(e){e.preventDefault();var b=$('#lf button');b.disabled=true;
    sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}).then(function(r){
      if(r.error){loginView('That email or password did not work.');return}boot()})};
}
function boot(){
  sb.auth.getSession().then(function(r){
    var s=r.data.session;if(!s){loginView();return}
    S.user=s.user;
    sb.from('ttwh_profiles').select('role,display_name').eq('user_id',s.user.id).maybeSingle().then(function(p){
      if(!p.data){sb.auth.signOut();loginView('This account does not have access.');return}
      S.role=p.data.role;S.name=p.data.display_name;S.tz=S.role==='client'?'America/Vancouver':undefined;
      sb.from('ttwh_settings').select('value').eq('key','billing').maybeSingle().then(function(b){S.billing=b.data&&b.data.value;route()});
    });
  });
}

/* ---------- router ---------- */
function route(){
  if(S.tick){clearInterval(S.tick);S.tick=null}
  var h=(location.hash||'#/home').replace(/^#\//,'').split('/'),r=h[0]||'home';
  var map={home:pHome,rr:pRR,overview:pOverview,contracts:pContracts,payments:pPayments,progress:pProgress,updates:pUpdates,package:pPackage,qa:pQA,timer:pTimer,invoice:pInvoice};
  if(!map[r]||(r==='timer'&&!isAdmin())){r='home'}
  if(r==='invoice'){app.innerHTML='<main><div class="wrap" id="page"></div></main>'}
  else shell(r,'<p>Loading…</p>');
  Promise.resolve().then(function(){return map[r](h[1])}).catch(function(e){setPage(note('Could not load this page: '+(e&&e.message||e)))});
}
window.addEventListener('hashchange',function(){if(S.user)route()});

/* ---------- home ---------- */
function pHome(){
  setPage('<h2>welcome'+(S.name?', '+esc(S.name):'')+'</h2><p>Choose a program to see its contract, payments, progress and updates.</p><div class="grid c2">'
   +'<a class="card g" href="#/overview" style="text-decoration:none;color:inherit"><div class="bar"></div><div class="in" style="padding:34px 20px;text-align:center"><h3 style="font-size:2.2rem;margin:0">Psychic Training School</h3><p class="small" style="margin:6px 0 0">PTS · open the package portal →</p></div></a>'
   +'<a class="card o" href="#/rr" style="text-decoration:none;color:inherit"><div class="bar"></div><div class="in" style="padding:34px 20px;text-align:center"><h3 style="font-size:2.2rem;margin:0">Relationships + Regulation</h3><p class="small" style="margin:6px 0 0">R+R · open the package portal →</p></div></a></div>');
}
function pRR(){
  setPage('<p><a href="#/home">← Home</a></p><h2>Relationships + Regulation</h2><div class="card o"><div class="bar"></div><div class="in"><p><b>Coming soon.</b> R+R has its own separate agreement, payments and progress. They will appear here once the agreement is ready.</p></div></div>');
}

/* ---------- overview ---------- */
function coursePct(cells){if(!cells.length)return 0;return cells.reduce(function(a,c){return a+STAGE_PCT[c.stage]},0)/cells.length}
function getPct(){return sb.from('ttwh_progress_cells').select('stage').then(must).then(function(c){return Math.round(coursePct(c))})}
function barMarks(pct,marks){
  return '<div style="position:relative;padding-bottom:24px"><div class="bar-wrap" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><div class="bar-fill" style="width:'+Math.min(100,pct)+'%"></div></div>'
   +marks.map(function(m){return '<span style="position:absolute;left:'+m+'%;top:0;height:18px;border-left:2px dashed var(--ink);margin-left:-1px"></span><span class="small" style="position:absolute;top:21px;'+(m>=100?'right:0':'left:calc('+m+'% - 14px)')+'">'+m+'%</span>'}).join('')+'</div>';
}
function lockOf(p,pct){
  if(!p||p.status==='paid'||p.unlocked_at)return {locked:false};
  return {locked:true,why:p.unlock_at_pct==null?'Unlocks when the agreement is signed':'Unlocks when progress reaches '+p.unlock_at_pct+'% (now '+pct+'%)'};
}
function stageBar(cells){
  var n=cells.length||1,L={not_started:'Not started',in_progress:'In progress',in_review:'In review',done:'Done'},c={};
  cells.forEach(function(x){c[x.stage]=(c[x.stage]||0)+1});
  var order=['done','in_review','in_progress','not_started'];
  return '<div class="stack" role="img" aria-label="Components by stage">'+order.map(function(k){return c[k]?'<span class="sg-'+k+'" style="width:'+(c[k]*100/n)+'%"></span>':''}).join('')+'</div><div class="legend">'+order.map(function(k){return '<span><i class="sg-'+k+'"></i>'+L[k]+' ('+(c[k]||0)+')</span>'}).join('')+'</div>';
}
function pOverview(){
  return Promise.all([
    sb.from('ttwh_packages').select('*').eq('code','PTS').maybeSingle(),
    sb.from('ttwh_progress_cells').select('stage'),
    sb.from('ttwh_payments').select('*').order('seq'),
    sb.from('ttwh_updates').select('*').order('published_at',{ascending:false,nullsFirst:false}).limit(1),
    sb.from('ttwh_qa_threads').select('id').eq('status','open'),
    sb.from('ttwh_contract_versions').select('status,version').order('version',{ascending:false}).limit(1)
  ]).then(function(r){
    var pkg=must(r[0]),cells=must(r[1]),pays=must(r[2]),up=must(r[3])[0],open=must(r[4]),cv=must(r[5])[0];
    var pct=Math.round(coursePct(cells)),next=pays.find(function(p){return p.status!=='paid'}),lk=lockOf(next,pct);
    var marks=pays.filter(function(p){return p.unlock_at_pct!=null}).map(function(p){return p.unlock_at_pct});
    setPage('<h2>overview</h2><div class="grid c2">'
     +'<div class="card"><div class="bar"></div><div class="in"><h3>package</h3><p><b>'+esc(pkg&&pkg.title)+'</b><br>'+money(pkg&&pkg.total_amount)+', paid in installments by PayPal.</p><p>Contract: '+(cv?chip(cv.status)+' <a href="#/contracts">open</a>':'<span class="small">coming soon</span>')+'</p></div></div>'
     +'<div class="card g"><div class="bar"></div><div class="in"><h3>progress</h3>'+barMarks(pct,marks.length?marks:[33,66,100])+'<p><b>'+pct+'%</b> of 27 items across 5 components. <a href="#/progress">see the grid</a></p></div></div>'
     +'<div class="card m"><div class="bar"></div><div class="in"><h3>next payment</h3>'+(next?'<p><b>'+esc(next.label)+'</b> '+chip(next.status)+'<br>'+money(next.amount)+(next.due_milestone?' · '+esc(next.due_milestone):'')+(lk.locked?'<br><span class="small">🔒 '+esc(lk.why)+'</span>':'<br><span class="small">Invoice is open. Due within 3 days.</span>')+'</p>':'<p class="small">All payments are done. Thank you.</p>')+'<a href="#/payments">payments</a></div></div>'
     +'<div class="card o"><div class="bar"></div><div class="in"><h3>latest update</h3>'+(up?'<p><b>'+esc(up.title)+'</b><br><span class="small">'+fmtDate(up.published_at||up.created_at)+'</span></p><a href="#/updates">read</a>':'<p class="small">No updates yet.</p>')+'</div></div>'
     +'</div><p style="margin-top:14px">Open questions: <b>'+open.length+'</b> · <a href="#/qa">Q&amp;A</a></p>');

/* ---------- contracts ---------- */
function pContracts(){
  return Promise.all([
    sb.from('ttwh_contracts').select('*'),
    sb.from('ttwh_contract_versions').select('*').order('version',{ascending:false}),
    sb.from('ttwh_signatures').select('*'),
    sb.from('ttwh_profiles').select('*')
  ]).then(function(r){
    var cons=must(r[0]),vers=must(r[1]),sigs=must(r[2]),profs=must(r[3]);
    var who={};profs.forEach(function(p){who[p.user_id]=p.display_name});
    var html='<h2>contracts</h2>';
    if(!cons.length||!vers.length)html+='<p>Nothing to show yet. The contract appears here once it is ready to read.</p>';
    cons.forEach(function(c){
      var cv=vers.filter(function(v){return v.contract_id===c.id});
      html+='<h3>'+esc(c.title)+'</h3>';
      cv.forEach(function(v,i){
        var vs=sigs.filter(function(s){return s.contract_version_id===v.id});
        var mine=vs.some(function(s){return s.signer_id===S.user.id});
        html+='<details class="card" '+(i===0?'open':'')+'><summary style="padding:10px 14px">Version '+v.version+' '+chip(v.status)+(v.finalised_at?' <span class="small">finalised '+fmtDate(v.finalised_at,true)+'</span>':'')+'</summary><div class="in" style="padding:0 16px 14px">';
        if(isAdmin()&&v.status==='draft'){
          html+='<label for="b'+v.id+'">Contract text (markdown: # heading, - list, **bold**)</label><textarea id="b'+v.id+'" style="min-height:320px">'+esc(v.body_md)+'</textarea><p style="margin-top:10px"><button class="btn sm" data-act="savever" data-id="'+v.id+'">Save draft</button> <button class="btn sm go" data-act="finalver" data-id="'+v.id+'">Mark final and open for signing</button> <button class="btn sm alt" data-act="share" data-id="'+v.id+'" data-v="'+(v.visible_to_client?'0':'1')+'">'+(v.visible_to_client?'Hide draft from Heidi':'Share this draft with Heidi')+'</button> '+(v.visible_to_client?'<span class="chip">shared with Heidi</span>':'<span class="chip">only you can see this</span>')+'</p>';
        }else html+=md(v.body_md);
        html+='<h4 style="font-size:1.5rem;margin-top:12px">signatures</h4>'+(vs.length?vs.map(function(s){return '<div class="row"><span>'+esc(s.typed_name)+' <span class="small">('+esc(who[s.signer_id]||'')+')</span></span><span class="small">'+fmtDate(s.signed_at,true)+'</span></div>'}).join(''):'<p class="small">Not signed yet.</p>');
        if(v.status==='final'&&!mine){
          html+='<div style="margin-top:12px;border:1.5px dashed var(--ink);padding:12px"><label for="n'+v.id+'">Type your full name to sign</label><input id="n'+v.id+'" autocomplete="name"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:500"><input type="checkbox" id="a'+v.id+'" style="width:auto;margin-top:5px"> I have read this version and I agree to it.</label><p style="margin-top:8px"><button class="btn sm go" data-act="sign" data-id="'+v.id+'">Sign</button></p><p class="small">A typed name is a simple electronic signature. It records who signed, when, and which version.</p></div>';
        }
        if(isAdmin()&&v.status!=='draft'&&i===0)html+='<p style="margin-top:10px"><button class="btn sm alt" data-act="newver" data-id="'+v.id+'" data-c="'+c.id+'" data-n="'+v.version+'">Start version '+(v.version+1)+' from this</button></p>';
        html+='</div></details>';
      });
    });
    setPage(html);
    $('#page').onclick=function(e){var b=e.target.closest('[data-act]');if(!b)return;var id=b.dataset.id,act=b.dataset.act;b.disabled=true;
      var p;
      if(act==='savever')p=sb.from('ttwh_contract_versions').update({body_md:$('#b'+id).value}).eq('id',id).then(must);
      else if(act==='finalver'){if(!confirm('Mark final? The text locks and Heidi can see and sign it.')){b.disabled=false;return}
        p=sb.from('ttwh_contract_versions').update({body_md:$('#b'+id).value}).eq('id',id).then(must).then(function(){return sb.from('ttwh_contract_versions').update({status:'final',finalised_at:new Date().toISOString()}).eq('id',id)}).then(must)}
      else if(act==='share'){p=sb.from('ttwh_contract_versions').update({visible_to_client:b.dataset.v==='1'}).eq('id',id).then(must)}
      else if(act==='sign'){var nm=$('#n'+id).value.trim();if(!nm||!$('#a'+id).checked){alert('Please type your name and tick the box.');b.disabled=false;return}
        p=sb.rpc('ttwh_sign_contract',{p_version_id:id,p_typed_name:nm}).then(must)}
      else if(act==='newver'){p=sb.from('ttwh_contract_versions').select('body_md').eq('id',id).single().then(must).then(function(v){return sb.from('ttwh_contract_versions').insert({contract_id:b.dataset.c,version:+b.dataset.n+1,body_md:v.body_md}).then(must)})}
      p.then(pContracts,function(err){fail(err);b.disabled=false});
    };
  });
}

/* ---------- payments & invoices ---------- */
function pPayments(){
  return Promise.all([
    sb.from('ttwh_payments').select('*').order('seq'),
    sb.from('ttwh_invoices').select('*').order('issued_on',{ascending:false}).order('number'),
    sb.from('ttwh_packages').select('*').eq('code','PTS').maybeSingle(),
    getPct()
  ]).then(function(r){
    var pays=must(r[0]),invs=must(r[1]),pkg=must(r[2]),pct=r[3],byId={};
    pays.forEach(function(p){byId[p.id]=p});
    var paid=pays.filter(function(p){return p.status==='paid'}).reduce(function(a,p){return a+Number(p.amount||0)},0);
    var marks=pays.filter(function(p){return p.unlock_at_pct!=null}).map(function(p){return p.unlock_at_pct});
    var html='<h2>payments</h2><div class="card m"><div class="bar"></div><div class="in"><div class="row"><span>Package total</span><b>'+money(pkg&&pkg.total_amount)+'</b></div><div class="row"><span>Paid so far</span><b>'+money(paid)+'</b></div>'
     +'<p style="margin-top:12px"><b>Project progress: '+pct+'%</b></p>'+barMarks(pct,marks.length?marks:[33,66,100])+'<p class="small">Each invoice unlocks when the bar reaches its mark. The first one unlocks when the agreement is signed.</p></div></div><h3>timeline</h3>';
    html+=pays.length?'<ul class="tl">'+pays.map(function(p){
      var lk=lockOf(p,pct);
      return '<li class="'+(lk.locked?'locked':esc(p.status))+'"><b>'+esc(p.label)+'</b> '+chip(p.status)+(lk.locked?' 🔒':'')+(p.visible_to_client?'':' <span class="chip">hidden</span>')
       +'<br>'+money(p.amount)+(p.due_milestone?' · '+esc(p.due_milestone):'')+(p.paid_at?' · paid '+fmtDate(p.paid_at):'')
       +(lk.locked?'<br><span class="small">'+esc(lk.why)+'</span>':(p.status!=='paid'?'<br><span class="small">Invoice is open. Due within 3 days.</span>':''))
       +(isAdmin()&&p.paypal_txn_id?'<br><span class="small">txn '+esc(p.paypal_txn_id)+'</span>':'')
       +(isAdmin()?'<br><button class="btn sm alt" data-act="editpay" data-id="'+p.id+'">edit</button>'+(!lk.locked&&p.status!=='paid'?' <button class="btn sm go" data-act="markpaid" data-id="'+p.id+'">Mark as paid</button>':''):'')+'</li>'}).join('')+'</ul>':'<p class="small">The payment schedule will appear here once it is agreed.</p>';
    html+='<h3>invoices and receipts</h3>'+(invs.length?invs.map(function(i){
      var lk=i.kind==='invoice'?lockOf(byId[i.payment_id],pct):{locked:false};
      return '<div class="row"><span><a href="#/invoice/'+i.id+'">'+(i.kind==='receipt'?'Receipt ':'Invoice ')+esc(i.number)+'</a> '+(i.kind==='receipt'?chip('paid'):(lk.locked?'<span class="chip draft">draft</span> 🔒':chip('open')))+(isAdmin()&&!i.published?' <span class="chip">hidden</span>':'')+'</span><span class="small">'+(lk.locked?'locked':fmtDate(i.issued_on))+'</span></div>'}).join(''):'<p class="small">None yet.</p>');
    if(isAdmin()){
      html+='<h3>add payment</h3><form class="card" id="pf"><div class="bar"></div><div class="in"><div class="grid c2"><div><label>Label</label><input name="label" required></div><div><label>Amount (CAD)</label><input name="amount" type="number" step="0.01"></div><div><label>Due milestone (text)</label><input name="due_milestone"></div><div><label>Unlocks at progress % (blank = when signed)</label><input name="unlock_at_pct" type="number" min="1" max="100"></div></div><label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" name="visible_to_client" checked style="width:auto;margin-top:5px"> Visible to Heidi</label><p style="margin-top:10px"><button class="btn sm" type="submit">Add payment</button></p></div></form>'
       +'<h3>new invoice</h3><form class="card" id="if"><div class="bar"></div><div class="in"><div class="grid c2"><div><label>Number (e.g. MM-2026-007)</label><input name="number" required></div><div><label>Issued on</label><input name="issued_on" type="date" required></div><div><label>Task</label><input name="task"></div><div><label>Work period</label><input name="work_period"></div><div><label>Rate (e.g. CAD $40.00 per hour)</label><input name="rate_text"></div><div><label>Due</label><input name="due_text" value="On receipt"></div><div><label>Linked payment (keeps it locked until its stage)</label><select name="payment_id"><option value="">None</option>'+pays.map(function(p){return '<option value="'+p.id+'">'+esc(p.label)+'</option>'}).join('')+'</select></div></div><label>Line items, one per line: part | description | minutes | amount</label><textarea name="lines" placeholder="a | Research. Drive, pricing docs. | 45 | 30.00"></textarea><label>Note (footer)</label><input name="note"><label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" name="published" style="width:auto;margin-top:5px"> Visible to Heidi</label><p style="margin-top:10px"><button class="btn sm" type="submit">Create invoice</button></p></div></form>';
    }
    setPage(html);
    if(isAdmin()){
      $('#pf').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);
        sb.from('ttwh_payments').insert({package_id:pkg.id,seq:pays.length+1,label:f.get('label'),amount:f.get('amount')||null,due_milestone:f.get('due_milestone')||null,unlock_at_pct:f.get('unlock_at_pct')?Number(f.get('unlock_at_pct')):null,visible_to_client:!!f.get('visible_to_client')}).then(must).then(pPayments).catch(fail)};
      $('#if').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);
        var items=String(f.get('lines')||'').split(/\r?\n/).filter(function(l){return l.trim()}).map(function(l){var p=l.split('|').map(function(x){return x.trim()});return {part:p[0],desc:p[1]||'',minutes:p[2]?Number(p[2]):null,amount:Number(p[3]||0)}});
        sb.from('ttwh_invoices').insert({kind:'invoice',number:f.get('number'),issued_on:f.get('issued_on'),task:f.get('task')||null,work_period:f.get('work_period')||null,rate_text:f.get('rate_text')||null,due_text:f.get('due_text')||'On receipt',payment_id:f.get('payment_id')||null,line_items:items,note:f.get('note')||null,published:!!f.get('published')}).then(must).then(pPayments).catch(fail)};
      $('#page').onclick=function(e){var b=e.target.closest('[data-act]');if(!b)return;var p=byId[b.dataset.id];if(!p)return;
        if(b.dataset.act==='markpaid'){
          var d=prompt('Date the payment was received (YYYY-MM-DD):',new Date().toISOString().slice(0,10));if(!d)return;
          var tx=prompt('PayPal transaction ID (optional):','');if(tx===null)return;
          b.disabled=true;sb.rpc('ttwh_mark_paid',{p_payment:p.id,p_paid_on:d,p_txn:tx||''}).then(must).then(pPayments).catch(function(err){fail(err);b.disabled=false});return;
        }
        if(b.dataset.act==='editpay'){
          var amt=prompt('Amount in CAD (blank = TBC):',p.amount==null?'':p.amount);if(amt===null)return;
          var ms=prompt('Due milestone text:',p.due_milestone||'');if(ms===null)return;
          var vis=confirm('Visible to Heidi? OK = yes, Cancel = no');
          sb.from('ttwh_payments').update({amount:amt.trim()===''?null:amt.trim(),due_milestone:ms||null,visible_to_client:vis}).eq('id',p.id).then(must).then(pPayments).catch(fail);
        }};
    }
  });
}
function payUrl(l){return /^https?:/i.test(l)?l:'https://'+l}
function qrSvg(t){try{var q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return ''}}
function pInvoice(id){
  return sb.from('ttwh_invoices').select('*').eq('id',id).maybeSingle().then(must).then(function(inv){
    if(!inv){setPage('<p>Not found.</p><p><a href="#/payments">Back</a></p>');return}
    return Promise.all([inv.payment_id?sb.from('ttwh_payments').select('*').eq('id',inv.payment_id).maybeSingle().then(must):null,getPct()]).then(function(x){
      var pay=x[0],pct=x[1],lk=inv.kind==='invoice'?lockOf(pay,pct):{locked:false};
      var B=S.billing||{},items=inv.line_items||[],total=items.reduce(function(a,i){return a+Number(i.amount||0)},0),mins=items.reduce(function(a,i){return a+Number(i.minutes||0)},0);
      var rec=inv.kind==='receipt',hasMin=items.some(function(i){return i.minutes!=null});
      var html='<p class="noprint"><a href="#/payments">← Back</a> '
       +(lk.locked?'<span class="chip draft">🔒 Locked: '+esc(lk.why)+'</span>':'<button class="btn sm" id="pr">Print / save as PDF</button>')
       +(isAdmin()&&lk.locked?' <button class="btn sm alt" id="pr">Print draft (admin)</button>':'')
       +(isAdmin()&&!rec?' <button class="btn sm alt" id="mkrec">Create receipt from this invoice</button>':'')
       +(isAdmin()?' <button class="btn sm alt" id="pub">'+(inv.published?'Hide from Heidi':'Show to Heidi')+'</button> <button class="btn sm alt" id="num">Edit number</button>':'')+'</p>'
       +'<div class="inv'+(lk.locked?' locked':'')+'">'+(lk.locked?'<div class="wm"><b>DRAFT INVOICE</b><span>Not due yet · '+esc(lk.why.replace('Unlocks','unlocks'))+'</span></div>':'')+'<div class="hd"><div><div class="gold"></div><div class="t">'+(rec?'RECEIPT':'INVOICE')+'</div><small>'+esc(B.tagline||'')+'</small></div><div style="text-align:right"><small>'+(rec?'RECEIPT NO.':'INVOICE NO.')+'</small><div class="no">'+esc(inv.number)+'</div><small>'+(rec?'DATE ':'ISSUED ')+(lk.locked?'WHEN UNLOCKED':esc(fmtDate(inv.issued_on)))+'</small>'+(rec?'':'<small>DUE '+(lk.locked?'WHEN UNLOCKED':esc(inv.due_text))+'</small>')+'</div></div><div class="bd">'
       +'<div class="two"><div class="box"><b class="l">FROM</b><b>'+esc(B.from_name)+'</b><br>'+(B.from_lines||[]).map(esc).join('<br>')+'</div><div class="box"><b class="l">BILLED TO</b><b>'+esc(B.to_name)+'</b><br>'+(B.to_lines||[]).map(esc).join('<br>')+'</div></div>'
       +'<div class="meta">'+(inv.task?'<div><span>TASK</span><b>'+esc(inv.task)+'</b></div>':'')+(inv.work_period?'<div><span>WORK PERIOD</span><b>'+esc(inv.work_period)+'</b></div>':'')+(inv.rate_text?'<div><span>RATE</span><b>'+esc(inv.rate_text)+'</b></div>':'')+(pay&&pay.due_milestone?'<div><span>STAGE</span><b>'+esc(pay.due_milestone)+'</b></div>':'')+'</div>'
       +'<table><thead><tr><th>PART</th><th>DESCRIPTION OF WORK</th>'+(hasMin?'<th class="r">TIME</th>':'')+'<th class="r">AMOUNT</th></tr></thead><tbody>'+items.map(function(i){return '<tr><td><b>'+esc(i.part||'')+'</b></td><td>'+esc(i.desc)+'</td>'+(hasMin?'<td class="r">'+(i.minutes!=null?esc(i.minutes)+' min':'')+'</td>':'')+'<td class="r"><b>$'+Number(i.amount||0).toFixed(2)+'</b></td></tr>'}).join('')+'</tbody></table>'
       +'<div style="display:grid;gap:16px;grid-template-columns:1fr 1fr;margin-top:16px" class="two"><div style="font-size:.85rem"><b style="color:#1b9aa0;font-size:.72rem">PAYMENT DETAILS</b><div class="row"><span>Method</span><b>'+esc(B.pay_method)+'</b></div><div class="row"><span>Account name</span><b>'+esc(B.pay_account)+'</b></div><div class="row"><span>Phone</span><b>'+esc(B.pay_phone)+'</b></div><div class="row"><span>PayPal link</span><b>'+(B.pay_link?'<a href="'+esc(payUrl(B.pay_link))+'" target="_blank" rel="noopener" style="color:#1b9aa0">'+esc(B.pay_link)+'</a>':'')+'</b></div>'+(B.pay_link&&!rec?'<div style="text-align:center;margin-top:10px"><div class="qr" style="width:120px;margin:0 auto">'+qrSvg(payUrl(B.pay_link))+'</div><small style="color:#6b7a99">Scan to pay with PayPal</small></div>':'')+'</div><div>'
       +(hasMin?'<div class="row"><span>Total time</span><b>'+mins+' minutes ('+(mins/60)+' hours)</b></div>':'')+'<div class="row"><span>Subtotal</span><b>$'+total.toFixed(2)+'</b></div><div class="tot"><span>'+(rec?'TOTAL PAID':'TOTAL DUE')+(rec?'<span class="paid">PAID</span>':'')+'</span><b>'+esc(B.currency||'CAD')+' $'+total.toFixed(2)+'</b></div></div></div>'
       +'<div class="sig"><div><div class="script">'+esc(B.signer_name)+'</div><div class="sigline"></div><b style="font-size:.85rem">'+esc(B.signer_name)+'</b><small>Digitally signed · '+(lk.locked?'on unlock':esc(fmtDate(inv.issued_on)))+' · Ref '+esc(inv.number)+'</small></div></div>'
       +(inv.note?'<p style="font-size:.85rem;margin-top:12px;color:#6b7a99">'+esc(inv.note)+'</p>':'')+'</div><div class="ft">Thank you, Heidi.<br>'+esc(B.from_name)+' | '+esc((B.from_lines||[])[1]||'')+'</div></div>';

        var mk=$('#mkrec');if(mk)mk.onclick=function(){var d=prompt('Date paid (YYYY-MM-DD):',new Date().toISOString().slice(0,10));if(!d)return;var num='RC-'+inv.number;
          sb.from('ttwh_invoices').insert({kind:'receipt',number:num,issued_on:d,task:inv.task,work_period:inv.work_period,rate_text:inv.rate_text,due_text:'Paid',payment_id:inv.payment_id,line_items:inv.line_items,note:'Payment received via PayPal. Thank you.',published:false}).select('id').single().then(must).then(function(n){location.hash='#/invoice/'+n.id}).catch(fail)};
      }
    });
  });
}

/* ---------- progress ---------- */
function pProgress(){
  return Promise.all([
    sb.from('ttwh_courses').select('*').order('position'),
    sb.from('ttwh_components').select('*').order('position'),
    sb.from('ttwh_progress_cells').select('*')
  ]).then(function(r){
    var courses=must(r[0]),comps=must(r[1]),cells=must(r[2]),map={};

    var overall=Math.round(coursePct(cells));
    var html='<h2>progress</h2><div class="bar-wrap"><div class="bar-fill" style="width:'+overall+'%"></div></div><p style="margin-top:6px"><b>'+overall+'%</b> overall · 27 items × 5 components. <span class="small">Done counts 100%, in review 75%, in progress 25%, not started 0%.</span></p>'+stageBar(cells);
    html+='<div class="tblwrap"><table><thead><tr><th>#</th><th>Item</th>'+comps.map(function(c){return '<th>'+esc(c.label)+'</th>'}).join('')+'<th>%</th><th>Current task</th></tr></thead><tbody>';
    courses.forEach(function(c){
      var cc=comps.map(function(k){return map[c.id+'|'+k.id]}).filter(Boolean);
      html+='<tr><td>'+c.position+'</td><th scope="row" style="background:none;position:static;white-space:normal">'+esc(c.title)+'</th>'+comps.map(function(k){var cell=map[c.id+'|'+k.id];if(!cell)return '<td></td>';
        if(isAdmin())return '<td><select class="st-'+cell.stage+'" data-c="'+c.id+'" data-k="'+k.id+'" aria-label="'+esc(c.title+' '+k.label)+'">'+STAGES.map(function(s){return '<option value="'+s+'"'+(s===cell.stage?' selected':'')+'>'+s.replace('_',' ')+'</option>'}).join('')+'</select>'+(cell.approval?'<br>'+chip(cell.approval):'')+'</td>';
        return '<td>'+chip(cell.stage)+(cell.approval?'<br>'+chip(cell.approval):'')+((cell.stage==='in_review'||cell.stage==='done')?'<br><button class="btn sm go" data-ap="approved" data-c="'+c.id+'" data-k="'+k.id+'" title="Approve">✓</button> <button class="btn sm alt" data-ap="needs_changes" data-c="'+c.id+'" data-k="'+k.id+'" title="Needs changes">✎</button>':'')+'</td>'}).join('')
        +'<td><b>'+Math.round(coursePct(cc))+'%</b></td><td>'+(isAdmin()?'<input data-task="'+c.id+'" value="'+esc(c.current_task||'')+'" aria-label="Current task for '+esc(c.title)+'">':esc(c.current_task||''))+'</td></tr>';
    });
    html+='</tbody></table></div>'+(isAdmin()?'':'<p class="small" style="margin-top:8px">✓ approves a component, ✎ asks for changes. Murtaza sees your choice straight away.</p>');
    setPage(html);
    $('#page').onchange=function(e){var s=e.target.closest('select[data-c]');if(!s)return;
      sb.from('ttwh_progress_cells').update({stage:s.value,updated_at:new Date().toISOString()}).eq('course_id',s.dataset.c).eq('component_id',s.dataset.k).then(must).then(pProgress).catch(fail)};
    $('#page').onfocusout=function(e){var i=e.target.closest('input[data-task]');if(!i)return;
      sb.from('ttwh_courses').update({current_task:i.value||null}).eq('id',i.dataset.task).then(must).catch(fail)};
    $('#page').onclick=function(e){var b=e.target.closest('[data-ap]');if(!b)return;b.disabled=true;
      sb.rpc('ttwh_set_approval',{p_course:b.dataset.c,p_component:b.dataset.k,p_approval:b.dataset.ap}).then(must).then(pProgress).catch(fail)};
  });
}

/* ---------- updates ---------- */
function pUpdates(){
  return sb.from('ttwh_updates').select('*').order('created_at',{ascending:false}).then(must).then(function(ups){
    var html='<h2>updates</h2>';
    if(isAdmin())html+='<form class="card" id="uf"><div class="bar"></div><div class="in"><label>Title</label><input name="title" required><label>Update (markdown)</label><textarea name="body"></textarea><p style="margin-top:10px"><button class="btn sm" name="m" value="draft" type="submit">Save as draft</button> <button class="btn sm go" name="m" value="published" type="submit">Publish</button></p></div></form>';
    html+=ups.length?ups.map(function(u){return '<div class="card"><div class="bar"></div><div class="in"><h3 style="margin-top:0">'+esc(u.title)+'</h3><p class="small">'+chip(u.status)+' '+fmtDate(u.published_at||u.created_at)+'</p>'+md(u.body_md)+(isAdmin()?'<button class="btn sm alt" data-id="'+u.id+'" data-st="'+u.status+'">'+(u.status==='draft'?'Publish':'Move back to draft')+'</button>':'')+'</div></div>'}).join(''):'<p class="small">No updates yet.</p>';
    setPage(html);
    if(isAdmin()){
      $('#uf').onsubmit=function(e){e.preventDefault();var f=e.target,m=e.submitter&&e.submitter.value||'draft';
        sb.from('ttwh_updates').insert({title:f.title.value,body_md:f.body.value,status:m,published_at:m==='published'?new Date().toISOString():null}).then(must).then(pUpdates).catch(fail)};
      $('#page').onclick=function(e){var b=e.target.closest('button[data-id]');if(!b)return;var pub=b.dataset.st==='draft';
        sb.from('ttwh_updates').update({status:pub?'published':'draft',published_at:pub?new Date().toISOString():null}).eq('id',b.dataset.id).then(must).then(pUpdates).catch(fail)};
    }
  });
}

/* ---------- package pages ---------- */
function pPackage(){
  return sb.from('ttwh_pages').select('*').order('position').then(must).then(function(pages){
    var html='<h2>package details</h2>';
    if(!pages.length)html+='<p class="small">Details will appear here soon.</p>';
    else html+='<p class="small">Jump to: '+pages.map(function(p){return '<a href="#/package" data-jump="pg-'+esc(p.slug)+'">'+esc(p.title)+'</a>'}).join(' · ')+'</p>';
    pages.forEach(function(p){
      html+='<div class="card" id="pgc-'+esc(p.slug)+'"><div class="bar"></div><div class="in"><h3 style="margin-top:0">'+esc(p.title)+(isAdmin()&&!p.published?' <span class="chip">hidden</span>':'')+'</h3>'
       +(isAdmin()?'<textarea id="pg-'+esc(p.slug)+'" style="min-height:220px">'+esc(p.body_md)+'</textarea><label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" id="pp-'+esc(p.slug)+'" '+(p.published?'checked':'')+' style="width:auto;margin-top:5px"> Visible to Heidi</label><p style="margin-top:8px"><button class="btn sm" data-slug="'+esc(p.slug)+'">Save</button></p>':md(p.body_md))+'</div></div>';
    });
    setPage(html);
    $('#page').onclick=function(e){
      var j=e.target.closest('[data-jump]');if(j){e.preventDefault();var t=document.getElementById('pgc-'+j.dataset.jump.slice(3));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
      var b=e.target.closest('button[data-slug]');if(!b||!isAdmin())return;var s=b.dataset.slug;
      sb.from('ttwh_pages').update({body_md:$('#pg-'+s).value,published:$('#pp-'+s).checked}).eq('slug',s).then(must).then(function(){b.textContent='Saved'}).catch(fail)};
  });
}

/* ---------- Q&A ---------- */
var ATT_BUCKET='ttwh-attachments',ATT_MAX=10*1024*1024,ATT_ACCEPT='image/png,image/jpeg,image/gif,image/webp,.pdf,.doc,.docx,.txt,.csv,.xlsx';
function aboutText(t,courses,comps){
  var c=courses.find(function(x){return x.id===t.course_id}),k=comps.find(function(x){return x.id===t.component_id});
  if(!c)return '';return esc(c.title)+(k?' · '+esc(k.label):'');
}
function uploadFiles(files,messageId){
  var list=Array.prototype.slice.call(files||[]);
  if(list.length>5)return Promise.reject(new Error('Please attach up to 5 files at a time.'));
  for(var i=0;i<list.length;i++){if(list[i].size>ATT_MAX)return Promise.reject(new Error(list[i].name+' is over 10 MB.'))}
  return list.reduce(function(chain,f){return chain.then(function(){
    var ext=((f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,8))||'bin',path=messageId+'/'+crypto.randomUUID()+'.'+ext;
    return sb.storage.from(ATT_BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false}).then(function(r){
      if(r.error)throw r.error;
      return sb.from('ttwh_qa_attachments').insert({message_id:messageId,path:path,filename:f.name.slice(0,200),size_bytes:f.size,content_type:f.type||null}).then(must)})})},Promise.resolve());
}
function threadCard(t,msgs,atts,who,courses,comps){
  var about=aboutText(t,courses,comps),res=t.status==='resolved',adm=isAdmin();
  var last=msgs.length?msgs[msgs.length-1]:null;
  var body=msgs.map(function(m){var at=atts.filter(function(a){return a.message_id===m.id}),mine=m.author_id===S.user.id;
    return '<div class="msg'+(mine?' me':'')+'"><div class="small"><b>'+esc(who[m.author_id]||'')+'</b> · '+fmtDate(m.created_at,true)+'</div>'+esc(m.body).replace(/\n/g,'<br>')
     +(at.length?'<div style="margin-top:6px">'+at.map(function(a){return '<button class="btn sm alt" data-path="'+esc(a.path)+'" data-fn="'+esc(a.filename)+'">📎 '+esc(a.filename)+'</button> '}).join('')+'</div>':'')+'</div>'}).join('');
  var reply=res?'':'<form class="rf" data-t="'+t.id+'" style="margin-top:8px"><label>Reply</label><textarea required style="min-height:70px" placeholder="Write a reply"></textarea><input type="file" class="rfile" multiple accept="'+ATT_ACCEPT+'" aria-label="Attach files"><p style="margin-top:6px"><button class="btn sm" type="submit">Send</button></p></form>';
  var acts=adm?'<p style="margin-top:8px">'+(res?'<button class="btn sm alt" data-st="open" data-t="'+t.id+'">Reopen</button>':'<button class="btn sm go" data-st="resolved" data-t="'+t.id+'">Mark resolved (hides it from Heidi)</button>')+'</p>':'';
  var head='<b>'+esc(t.subject)+'</b> '+chip(t.status)+(about?' <span class="chip">About: '+about+'</span>':'')+' <span class="small">'+msgs.length+' message'+(msgs.length===1?'':'s')+(last?' · last '+fmtDate(last.created_at):'')+'</span>';
  return '<details class="card thread'+(res?' resolved':'')+'" id="th-'+t.id+'"'+(res?'':' open')+'><summary style="padding:10px 14px;cursor:pointer">'+head+'</summary><div class="in" style="padding:0 16px 14px">'+body+reply+acts+'</div></details>';
}
function pQA(id){
  return Promise.all([
    sb.from('ttwh_qa_threads').select('*').order('created_at',{ascending:false}),
    sb.from('ttwh_qa_messages').select('*').order('created_at'),
    sb.from('ttwh_qa_attachments').select('*'),
    sb.from('ttwh_profiles').select('*'),
    sb.from('ttwh_courses').select('id,title,position').order('position'),
    sb.from('ttwh_components').select('id,label,position').order('position')
  ]).then(function(r){
    var th=must(r[0]),ms=must(r[1]),at=must(r[2]),who={},courses=must(r[4]),comps=must(r[5]);must(r[3]).forEach(function(p){who[p.user_id]=p.display_name});
    var live=th.filter(function(t){return t.status!=='resolved'}),done=th.filter(function(t){return t.status==='resolved'});
    var card=function(t){var m=ms.filter(function(x){return x.thread_id===t.id}),ids=m.map(function(x){return x.id});return threadCard(t,m,at.filter(function(a){return ids.indexOf(a.message_id)>-1}),who,courses,comps)};
    var html='<h2>questions</h2><details class="card" id="newq"><summary style="padding:10px 14px;cursor:pointer"><b>＋ Ask a new question</b></summary><form id="qf" class="in" style="padding:0 16px 14px">'
     +'<label for="qc">What is it about? (optional)</label><select id="qc"><option value="">A general question</option>'+courses.map(function(c){return '<option value="'+c.id+'">'+c.position+'. '+esc(c.title)+'</option>'}).join('')+'</select>'
     +'<div id="qkw" hidden><label for="qk">Which component?</label><select id="qk"><option value="">The whole item / not sure</option>'+comps.map(function(k){return '<option value="'+k.id+'">'+esc(k.label)+'</option>'}).join('')+'</select></div>'
     +'<label for="qs">Subject</label><input id="qs" required><label for="qb">Your question</label><textarea id="qb" required style="min-height:90px"></textarea>'
     +'<label for="qa">Attach files (optional, up to 5, 10 MB each)</label><input id="qa" type="file" multiple accept="'+ATT_ACCEPT+'">'
     +'<p style="margin-top:10px"><button class="btn sm" type="submit">Post</button></p></form></details>';
    html+=live.length?live.map(card).join(''):'<p class="small" style="margin-top:12px">No open questions. Thank you!</p>';
    if(isAdmin()&&done.length)html+='<h3>resolved ('+done.length+')</h3><p class="small">Hidden from Heidi. Open one to read it or reopen it.</p>'+done.map(card).join('');
    setPage(html);
    if(id){var el=document.getElementById('th-'+id);if(el){el.open=true;el.scrollIntoView()}}
    $('#qc').onchange=function(){$('#qkw').hidden=!this.value;if(!this.value)$('#qk').value=''};
    $('#qf').onsubmit=function(e){e.preventDefault();var btn=$('#qf button');btn.disabled=true;
      sb.from('ttwh_qa_threads').insert({subject:$('#qs').value,course_id:$('#qc').value||null,component_id:$('#qc').value&&$('#qk').value?$('#qk').value:null}).select('id').single().then(must)
       .then(function(t){return sb.from('ttwh_qa_messages').insert({thread_id:t.id,body:$('#qb').value}).select('id').single().then(must).then(function(m){return uploadFiles($('#qa').files,m.id)}).catch(function(err){alert('Your question was posted, but the attachment failed: '+(err.message||err))}).then(function(){pQA(t.id)})})
       .catch(function(err){fail(err);btn.disabled=false})};
    var pg=$('#page');
    pg.onclick=function(e){
      var b=e.target.closest('button[data-path]');
      if(b){sb.storage.from(ATT_BUCKET).createSignedUrl(b.dataset.path,120,{download:b.dataset.fn}).then(function(x){if(x.error)return fail(x.error);window.open(x.data.signedUrl,'_blank','noopener')});return}
      var s=e.target.closest('button[data-st]');
      if(s&&isAdmin()){e.preventDefault();var tid=s.dataset.t,v=s.dataset.st;s.disabled=true;
        sb.from('ttwh_qa_threads').update({status:v,resolved_at:v==='resolved'?new Date().toISOString():null}).eq('id',tid).then(must).then(function(){pQA(v==='open'?tid:null)}).catch(function(err){fail(err);s.disabled=false})}};
    pg.onsubmit=function(e){var f=e.target.closest('form.rf');if(!f)return;e.preventDefault();var btn=f.querySelector('button'),tid=f.dataset.t;btn.disabled=true;
      sb.from('ttwh_qa_messages').insert({thread_id:tid,body:f.querySelector('textarea').value}).select('id').single().then(must)
       .then(function(m){return uploadFiles(f.querySelector('.rfile').files,m.id).catch(function(err){alert('Your reply was sent, but the attachment failed: '+(err.message||err))})})
       .then(function(){pQA(tid)}).catch(function(err){fail(err);btn.disabled=false})};
    var nq=$('#qf');nq.addEventListener('submit',function(e){e.stopPropagation()},true);
  });
}

/* ---------- timer (admin only) ---------- */
function pTimer(){
  return sb.from('ttwh_time_entries').select('*').order('started_at',{ascending:false}).then(must).then(function(es){
    var running=es.find(function(e){return !e.ended_at});
    function total(){return es.reduce(function(a,e){return a+((e.ended_at?new Date(e.ended_at):new Date())-new Date(e.started_at))},0)}
    var html='<h2>project timer</h2><div class="card m"><div class="bar"></div><div class="in"><div class="small">Total time on this project</div><div class="timer" id="tt">'+hms(total())+'</div><p class="small">'+(total()/3600000).toFixed(2)+' hours · only you can see this page</p></div></div>'
     +'<div class="card"><div class="bar"></div><div class="in">'+(running?'<p><b>Running since '+fmtDate(running.started_at,true)+'</b></p><label for="tn">Note</label><input id="tn" value="'+esc(running.note||'')+'" placeholder="What did you work on?"><p style="margin-top:10px"><button class="btn go" id="stop">Stop timer</button></p>':'<label for="tn">What are you starting?</label><input id="tn" placeholder="e.g. Intro video edit"><p style="margin-top:10px"><button class="btn go" id="start">Start timer</button></p>')+'</div></div>'
     +'<h3>add time by hand</h3><form class="card" id="mf"><div class="bar"></div><div class="in"><div class="grid c3"><div><label>Date</label><input name="d" type="date" required></div><div><label>Minutes</label><input name="m" type="number" min="1" required></div><div><label>Note</label><input name="n"></div></div><p style="margin-top:10px"><button class="btn sm" type="submit">Add</button></p></div></form>'
     +'<h3>entries</h3>'+(es.length?es.map(function(e){var ms=(e.ended_at?new Date(e.ended_at):new Date())-new Date(e.started_at);return '<div class="row"><span>'+fmtDate(e.started_at,true)+' · <b>'+(e.ended_at?hms(ms):'running')+'</b> '+esc(e.note||'')+'</span><button class="btn sm alt" data-del="'+e.id+'">delete</button></div>'}).join(''):'<p class="small">Nothing logged yet.</p>');
    setPage(html);
    if(running)S.tick=setInterval(function(){var t=$('#tt');if(t)t.textContent=hms(total())},1000);
    var st=$('#start');if(st)st.onclick=function(){sb.from('ttwh_time_entries').insert({started_at:new Date().toISOString(),note:$('#tn').value||null}).then(must).then(pTimer).catch(fail)};
    var sp=$('#stop');if(sp)sp.onclick=function(){sb.from('ttwh_time_entries').update({ended_at:new Date().toISOString(),note:$('#tn').value||null}).eq('id',running.id).then(must).then(pTimer).catch(fail)};
    $('#mf').onsubmit=function(e){e.preventDefault();var f=e.target,s=new Date(f.d.value+'T09:00:00'),en=new Date(s.getTime()+Number(f.m.value)*60000);
      sb.from('ttwh_time_entries').insert({started_at:s.toISOString(),ended_at:en.toISOString(),note:f.n.value||null}).then(must).then(pTimer).catch(fail)};
    $('#page').onclick=function(e){var b=e.target.closest('[data-del]');if(!b||!confirm('Delete this entry?'))return;sb.from('ttwh_time_entries').delete().eq('id',b.dataset.del).then(must).then(pTimer).catch(fail)};
  });
}

boot();
})();
</script>
