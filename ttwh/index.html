/* ---------- contracts ---------- */
function pContracts(){
  return Promise.all([
    sb.from('ttwh_contracts').select('*'),
    sb.from('ttwh_contract_versions').select('*').order('version',{ascending:false}),
    sb.from('ttwh_signatures').select('*'),
    sb.from('ttwh_profiles').select('*')
  ]).then(function(r){
    var cons=must(r[0]),vers=must(r[1]),sigs=must(r[2]),profs=must(r[3]);

    var html='<h2>contracts</h2>';
    if(!cons.length||!vers.length)html+='<p>Nothing to show yet. The contract appears here once it is ready to read.</p>';
    cons.forEach(function(c){
      var cv=vers.filter(function(v){return v.contract_id===c.id}).slice(0,1);
      html+='<h3>'+esc(c.title)+'</h3>';
      cv.forEach(function(v,i){
        var vs=sigs.filter(function(s){return s.contract_version_id===v.id});
        var mine=vs.some(function(s){return s.signer_id===S.user.id});
        html+='<details class="card" '+(i===0?'open':'')+'><summary style="padding:10px 14px">Version '+v.version+' '+chip(v.status)+(v.finalised_at?' <span class="small">finalised '+fmtDate(v.finalised_at,true)+'</span>':'')+'</summary><div class="in" style="padding:0 16px 14px">';

        }else html+=md(v.body_md);
        html+='<h4 style="font-size:1.5rem;margin-top:12px">signatures</h4>'+(vs.length?vs.map(function(s){return '<div class="row"><span>'+esc(s.typed_name)+' <span class="small">('+esc(who[s.signer_id]||'')+')</span></span><span class="small">'+fmtDate(s.signed_at,true)+'</span></div>'}).join(''):'<p class="small">Not signed yet.</p>');
        if(v.status==='final'&&!mine){
          html+='<div style="margin-top:12px;border:1.5px dashed var(--ink);padding:12px"><label for="n'+v.id+'">Type your full name to sign</label><input id="n'+v.id+'" autocomplete="name"><label style="display:flex;gap:8px;align-items:flex-start;font-weight:500"><input type="checkbox" id="a'+v.id+'" style="width:auto;margin-top:5px"> I have read this version and I agree to it.</label><p style="margin-top:8px"><button class="btn sm go" data-act="sign" data-id="'+v.id+'">Sign</button></p><p class="small">A typed name is a simple electronic signature. It records who signed, when, and which version.</p></div>';
        }
        if(isAdmin()&&v.status==='final')html+='<p style="margin-top:10px"><button class="btn sm alt" data-act="reopen" data-id="'+v.id+'">Revert to draft to edit</button> <span class="small">Allowed until both of you have signed. Any signature already given is cleared.</span></p>';
        html+='</div></details>';
      });
    });
    setPage(html);
    $('#page').onclick=function(e){var b=e.target.closest('[data-act]');if(!b)return;var id=b.dataset.id,act=b.dataset.act;b.disabled=true;
      var p;
      if(act==='savever')p=sb.from('ttwh_contract_versions').update({body_md:$('#b'+id).value}).eq('id',id).then(must);
      else if(act==='finalver'){if(!confirm('Mark final? Heidi can then see and sign it. You can still revert to draft and edit until both of you have signed.')){b.disabled=false;return}
        p=sb.from('ttwh_contract_versions').update({body_md:$('#b'+id).value}).eq('id',id).then(must).then(function(){return sb.from('ttwh_contract_versions').update({status:'final',finalised_at:new Date().toISOString()}).eq('id',id)}).then(must)}

      p.then(pContracts,function(err){fail(err);b.disabled=false});
    };
  });

/* ---------- progress ---------- */
var PD=null,OPEN=null,SEL={};
function tierOf(p){return p<=0?'ns':p<50?'ip':p<100?'ir':'dn'}
function vp1(s){return s==='uploaded'?100:s==='done_laptop'?75:s==='in_process'?25:0}
function videoPct(v){var e=vp1(v.stage),b=v.needs_brief?vp1(v.brief_stage):e;return (e+b)/2}
function vidsAvg(vs){return vs.length?vs.reduce(function(a,v){return a+videoPct(v)},0)/vs.length:0}
function cellPct(key,cell,vs){if(key==='ai_video'&&vs.length)return vidsAvg(vs);return cell?stOf(key,cell.stage).pct:0}
function itemPct(cells,km,vs){return cells.reduce(function(a,c){return a+(WEIGHT[km[c.component_id]]||0)*cellPct(km[c.component_id],c,vs)/100},0)}
function overallOf(cells,comps,vids){if(!cells.length)return 0;var km=keyMap(comps),by={},n=0,t=0;cells.forEach(function(c){(by[c.course_id]=by[c.course_id]||[]).push(c)});
  Object.keys(by).forEach(function(id){t+=itemPct(by[id],km,vids.filter(function(v){return v.course_id===id}));n++});return t/n}
function getVids(){return sb.from('ttwh_videos').select('*').order('position').then(function(r){return r.error?[]:(r.data||[])},function(){return[]})}
function getPct(){return Promise.all([sb.from('ttwh_progress_cells').select('stage,course_id,component_id'),sb.from('ttwh_components').select('id,key'),getVids()]).then(function(r){return Math.round(overallOf(must(r[0]),must(r[1]),r[2]))})}
function stageBar(cells,comps,vids){
  var km=keyMap(comps),c={},L={ns:'Not started',ip:'In progress',ir:'Nearly there',dn:'Done'},n=cells.length||1;
  cells.forEach(function(x){var k=km[x.component_id],t=tierOf(cellPct(k,x,vids.filter(function(v){return v.course_id===x.course_id})));if(t==='ir'&&cellPct(k,x,vids.filter(function(v){return v.course_id===x.course_id}))>=100)t='dn';c[t]=(c[t]||0)+1});
  var order=['dn','ir','ip','ns'];
  return '<div class="stack" role="img" aria-label="Components by stage">'+order.map(function(k){return c[k]?'<span class="sg-'+k+'" style="width:'+(c[k]*100/n)+'%"></span>':''}).join('')+'</div><div class="legend">'+order.map(function(k){return '<span><i class="sg-'+k+'"></i>'+L[k]+' ('+(c[k]||0)+')</span>'}).join('')+'</div>';
}
function vidSummary(vs){var up=vs.filter(function(v){return v.stage==='uploaded'}).length;return up+'/'+vs.length+' on Drive'}
function pProgress(){
  return Promise.all([
    sb.from('ttwh_courses').select('*').order('position'),
    sb.from('ttwh_components').select('*').order('position'),
    sb.from('ttwh_progress_cells').select('*'),
    getVids()
  ]).then(function(r){
    var courses=must(r[0]),comps=must(r[1]),cells=must(r[2]),vids=r[3],map={},km=keyMap(comps);
    PD={courses:courses,comps:comps,cells:cells,vids:vids,km:km};
    cells.forEach(function(c){map[c.course_id+'|'+c.component_id]=c});
    var overall=Math.round(overallOf(cells,comps,vids));
    var html='<h2>progress</h2><div class="bar-wrap"><div class="bar-fill" style="width:'+overall+'%"></div></div><p style="margin-top:6px"><b>'+overall+'%</b> overall · 27 items. <span class="small">Each item: video editing 30%, workbook 30%, splash page 20%, YouTube 10%, Wix program 10%. <span class="star">★</span> = not recorded yet. Click an item name for its full breakdown.</span></p>'+stageBar(cells,comps,vids);
    html+='<div class="tblwrap"><table><thead><tr><th>#</th><th>Item</th>'+comps.map(function(c){return '<th>'+esc(c.label)+'<br><span class="small" style="font-weight:400">'+(WEIGHT[c.key]||0)+'%</span></th>'}).join('')+'<th>%</th><th>Current task</th></tr></thead><tbody>';
    courses.forEach(function(c){
      var cc=comps.map(function(k){return map[c.id+'|'+k.id]}).filter(Boolean),vs=vids.filter(function(v){return v.course_id===c.id});
      html+='<tr><td>'+c.position+'</td><th scope="row" style="background:none;position:static;white-space:normal"><button class="lk" data-open="'+c.id+'">'+esc(c.title)+'</button>'+(c.not_recorded?' <span class="star" title="Not recorded yet">★</span>':'')+'</th>'+comps.map(function(k){var cell=map[c.id+'|'+k.id];if(!cell)return '<td></td>';
        if(k.key==='ai_video'&&vs.length){var ap=vidsAvg(vs);return '<td><button class="lk" data-open="'+c.id+'"><span class="chip t-'+tierOf(ap)+'">'+esc(vidSummary(vs))+'</span></button>'+(cell.approval?'<br>'+chip(cell.approval):'')+'</td>'}
        var st=stOf(k.key,cell.stage),tr=tierOf(st.pct);
        if(isAdmin())return '<td><select class="t-'+tr+'" data-c="'+c.id+'" data-k="'+k.id+'" aria-label="'+esc(c.title+' '+k.label)+'">'+(COMP_STAGES[k.key]||[]).map(function(o){return '<option value="'+o[0]+'"'+(o[0]===st.key?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'+(cell.approval?'<br>'+chip(cell.approval):'')+'</td>';
        return '<td><span class="chip t-'+tr+'">'+esc(st.label)+'</span>'+(cell.approval?'<br>'+chip(cell.approval):'')+'</td>'}).join('')
        +'<td><b>'+Math.round(itemPct(cc,km,vs))+'%</b></td><td>'+(isAdmin()?'<input data-task="'+c.id+'" value="'+esc(c.current_task||'')+'" aria-label="Current task for '+esc(c.title)+'">':esc(c.current_task||''))+'</td></tr>';
    });
    html+='</tbody></table></div>';
    setPage(html);
    $('#page').onchange=function(e){var s=e.target.closest('select[data-c]');if(!s)return;
      sb.from('ttwh_progress_cells').update({stage:s.value,updated_at:new Date().toISOString()}).eq('course_id',s.dataset.c).eq('component_id',s.dataset.k).then(must).then(pProgress).catch(fail)};
    $('#page').onfocusout=function(e){var i=e.target.closest('input[data-task]');if(!i)return;
      sb.from('ttwh_courses').update({current_task:i.value||null}).eq('id',i.dataset.task).then(must).catch(fail)};
    $('#page').onclick=function(e){var b=e.target.closest('[data-open]');if(b){OPEN=b.dataset.open;showCourse();}};
    if(OPEN)showCourse();
  });
}
var VOPTS=[['not_started','Not started'],['in_process','In process'],['done_laptop','Done on laptop'],['uploaded','Uploaded to Drive']];
function vsel(cls,val,id,dis){return '<select class="'+cls+' t-'+tierOf(vp1(val))+'" data-vid="'+id+'"'+(dis?' disabled':'')+'>'+VOPTS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===val?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'}
function showCourse(){
  if(!PD)return;var c=PD.courses.filter(function(x){return x.id===OPEN})[0];if(!c){OPEN=null;return}
  var dlg=document.getElementById('cd');
  if(!dlg){dlg=document.createElement('dialog');dlg.id='cd';document.body.appendChild(dlg);dlg.addEventListener('close',function(){OPEN=null;SEL={}});wireCourse(dlg)}
  var adm=isAdmin(),km=PD.km,cells=PD.cells.filter(function(x){return x.course_id===c.id}),vs=PD.vids.filter(function(v){return v.course_id===c.id}),byKey={};
  cells.forEach(function(x){byKey[km[x.component_id]]=x});
  var pct=Math.round(itemPct(cells,km,vs));
  function compRow(key,title){var cell=byKey[key];if(!cell)return '';var st=stOf(key,cell.stage),cp=cellPct(key,cell,vs);
    var ctl=adm?'<select class="t-'+tierOf(st.pct)+'" data-ck="'+cell.component_id+'">'+(COMP_STAGES[key]||[]).map(function(o){return '<option value="'+o[0]+'"'+(o[0]===st.key?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>':'<span class="chip t-'+tierOf(st.pct)+'">'+esc(st.label)+'</span>';
    return '<div class="cs"><div class="ch"><b>'+title+'</b> <span class="small">'+(WEIGHT[key]||0)+'% of the item</span></div><p style="margin:6px 0">'+ctl+approvalUi(cell,cp)+'</p></div>'}
  function approvalUi(cell,cp){if(adm)return cell.approval?' '+chip(cell.approval):'';return (cell.approval?' '+chip(cell.approval):'')+(cp>=75?' <button class="btn sm go" data-ap="approved" data-k="'+cell.component_id+'" title="Approve">✓</button> <button class="btn sm alt" data-ap="needs_changes" data-k="'+cell.component_id+'" title="Needs changes">✎</button>':'')}
  var vcell=byKey.ai_video,vhtml='<div class="cs"><div class="ch"><b>Video editing</b> <span class="small">'+(WEIGHT.ai_video||0)+'% of the item'+(vs.length?' · '+vidSummary(vs):'')+'</span></div>';
  if(!vs.length){vhtml+='<p class="small" style="margin:6px 0">No videos listed yet.'+(vcell&&adm?'':'')+'</p>'+(vcell?'<p style="margin:6px 0">Overall status: '+(adm?'<select class="t-'+tierOf(stOf('ai_video',vcell.stage).pct)+'" data-ck="'+vcell.component_id+'">'+COMP_STAGES.ai_video.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===stOf('ai_video',vcell.stage).key?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>':'<span class="chip t-'+tierOf(stOf('ai_video',vcell.stage).pct)+'">'+esc(stOf('ai_video',vcell.stage).label)+'</span>')+'</p>':'')}
  else{
    if(adm)vhtml+='<div class="bulk"><b>Bulk:</b> <label><input type="checkbox" id="vall"> select all</label> <select id="bE"><option value="">Editing status…</option>'+VOPTS.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>'}).join('')+'</select> <select id="bB"><option value="">Brief status…</option>'+VOPTS.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>'}).join('')+'</select> <button class="btn sm go" data-bulk="apply">Apply to selected</button> <button class="btn sm alt" data-bulk="nb1">Needs brief</button> <button class="btn sm alt" data-bulk="nb0">No brief</button> <button class="btn sm alt" data-bulk="del">Delete</button></div>';
    vhtml+='<div class="tblwrap" style="margin-top:6px"><table class="vt"><thead><tr>'+(adm?'<th></th>':'')+'<th>Video</th><th>Editing</th><th>Brief</th></tr></thead><tbody>'+vs.map(function(v){
      return '<tr>'+(adm?'<td><input type="checkbox" class="vsel" data-v="'+v.id+'"'+(SEL[v.id]?' checked':'')+' aria-label="Select"></td>':'')
       +'<td>'+(adm?'<input class="vt-title" data-vt="'+v.id+'" value="'+esc(v.title)+'">':esc(v.title))+(adm?'<br><label class="small"><input type="checkbox" class="vnb" data-v="'+v.id+'"'+(v.needs_brief?' checked':'')+'> needs a brief</label>':'')+'</td>'
       +'<td>'+(adm?vsel('ve',v.stage,v.id):'<span class="chip t-'+tierOf(vp1(v.stage))+'">'+esc(VOPTS.filter(function(o){return o[0]===v.stage})[0][1])+'</span>')+'</td>'
       +'<td>'+(v.needs_brief?(adm?vsel('vb',v.brief_stage,v.id):'<span class="chip t-'+tierOf(vp1(v.brief_stage))+'">'+esc(VOPTS.filter(function(o){return o[0]===v.brief_stage})[0][1])+'</span>'):'<span class="small">not needed</span>')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  if(adm)vhtml+='<details style="margin-top:8px"><summary class="small">Add videos</summary><textarea id="newv" placeholder="One video name per line" style="min-height:100px"></textarea><p style="margin-top:6px"><button class="btn sm" data-addv="1">Add</button></p></details>';
  vhtml+='</div>';
  dlg.innerHTML='<div class="dh"><h3 style="margin:0">'+esc(c.title)+(c.not_recorded?' <span class="star">★</span>':'')+'</h3><button class="btn sm alt" data-close="1" aria-label="Close">Close</button></div><p class="small">Item '+c.position+' · <b>'+pct+'%</b> complete'+(c.not_recorded?' · <b>Not recorded yet</b>':'')+'</p>'
   +(adm?'<label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" id="nrc" '+(c.not_recorded?'checked':'')+' style="width:auto;margin-top:5px"> Not recorded yet (shows ★)</label>':'')
   +vhtml+compRow('youtube','YouTube')+compRow('wix_program','Wix program')+compRow('workbook','Workbook (one for the whole course)')+compRow('splash_page','Splash page (one for the whole course)');
  if(!dlg.open)dlg.showModal();

function wireCourse(dlg){
  var redo=function(p){return p.then(must).then(pProgress).catch(fail)};
  dlg.addEventListener('click',function(e){
    if(e.target.closest('[data-close]')||e.target===dlg){dlg.close();return}
    var ap=e.target.closest('[data-ap]');
    if(ap){ap.disabled=true;redo(sb.rpc('ttwh_set_approval',{p_course:OPEN,p_component:ap.dataset.k,p_approval:ap.dataset.ap}));return}
    if(!isAdmin())return;
    var ids=function(){return Object.keys(SEL).filter(function(k){return SEL[k]})};
    var bk=e.target.closest('[data-bulk]');
    if(bk){var act=bk.dataset.bulk,sel=ids();if(!sel.length){alert('Tick the videos first.');return}
      var now=new Date().toISOString();
      if(act==='apply'){var pe=document.getElementById('bE').value,pb=document.getElementById('bB').value;if(!pe&&!pb){alert('Pick an editing or brief status first.');return}
        var patch={updated_at:now};if(pe)patch.stage=pe;if(pb){patch.brief_stage=pb;patch.needs_brief=true}
        redo(sb.from('ttwh_videos').update(patch).in('id',sel))}
      else if(act==='nb1')redo(sb.from('ttwh_videos').update({needs_brief:true,updated_at:now}).in('id',sel));
      else if(act==='nb0')redo(sb.from('ttwh_videos').update({needs_brief:false,updated_at:now}).in('id',sel));
      else if(act==='del'){if(!confirm('Delete '+sel.length+' video(s) from this list?'))return;SEL={};redo(sb.from('ttwh_videos').delete().in('id',sel))}
      return}
    var av=e.target.closest('[data-addv]');
    if(av){var names=document.getElementById('newv').value.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean);if(!names.length)return;
      var base=PD.vids.filter(function(v){return v.course_id===OPEN}).length;
      redo(sb.from('ttwh_videos').insert(names.map(function(n,i){return {course_id:OPEN,title:n,position:base+i+1}})));return}
  });
  dlg.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='vall'){PD.vids.filter(function(v){return v.course_id===OPEN}).forEach(function(v){SEL[v.id]=t.checked});dlg.querySelectorAll('.vsel').forEach(function(x){x.checked=t.checked});return}
    if(t.classList.contains('vsel')){SEL[t.dataset.v]=t.checked;return}
    if(!isAdmin())return;
    var redo=function(p){return p.then(must).then(pProgress).catch(fail)},now=new Date().toISOString();
    if(t.classList.contains('ve'))redo(sb.from('ttwh_videos').update({stage:t.value,updated_at:now}).eq('id',t.dataset.vid));
    else if(t.classList.contains('vb'))redo(sb.from('ttwh_videos').update({brief_stage:t.value,updated_at:now}).eq('id',t.dataset.vid));
    else if(t.classList.contains('vnb'))redo(sb.from('ttwh_videos').update({needs_brief:t.checked,updated_at:now}).eq('id',t.dataset.v));
    else if(t.classList.contains('vt-title')){if(t.value.trim())redo(sb.from('ttwh_videos').update({title:t.value.trim(),updated_at:now}).eq('id',t.dataset.vt))}
    else if(t.dataset.ck)redo(sb.from('ttwh_progress_cells').update({stage:t.value,updated_at:now}).eq('course_id',OPEN).eq('component_id',t.dataset.ck));
    else if(t.id==='nrc')redo(sb.from('ttwh_courses').update({not_recorded:t.checked}).eq('id',OPEN));
  });
}

function pUpdates(){

    var html='<h2>updates</h2>';
    if(isAdmin())html+='<form class="card" id="uf"><div class="bar"></div><div class="in"><label>Title</label><input name="title" required><label>Update (markdown)</label><textarea name="body"></textarea><p style="margin-top:10px"><button class="btn sm" name="m" value="draft" type="submit">Save as draft</button> <button class="btn sm go" name="m" value="published" type="submit">Publish</button></p></div></form>';
    html+=ups.length?ups.map(function(u){return '<div class="card"><div class="bar"></div><div class="in"><h3 style="margin-top:0">'+esc(u.title)+'</h3><p class="small">'+chip(u.status)+' '+fmtDate(u.published_at||u.created_at)+'</p>'+md(u.body_md)+(isAdmin()?'<button class="btn sm alt" data-id="'+u.id+'" data-st="'+u.status+'">'+(u.status==='draft'?'Publish':'Move back to draft')+'</button>':'')+'</div></div>'}).join(''):'<p class="small">No updates yet.</p>';
    setPage(html);
    if(isAdmin()){
      $('#uf').onsubmit=function(e){e.preventDefault();var f=e.target,m=e.submitter&&e.submitter.value||'draft';
        sb.from('ttwh_updates').insert({title:f.title.value,body_md:f.body.value,status:m,published_at:m==='published'?new Date().toISOString():null}).then(must).then(pUpdates).catch(fail)};
      $('#page').onclick=function(e){var b=e.target.closest('button[data-id]');if(!b)return;var pub=b.dataset.st==='draft';
        sb.from('ttwh_updates').update({status:pub?'published':'draft',published_at:pub?new Date().toISOString():null}).eq('id',b.dataset.id).then(must).then(pUpdates).catch(fail)};
    }
  });
}

/* ---------- package pages ---------- */
function pPackage(){
  return sb.from('ttwh_pages').select('*').order('position').then(must).then(function(pages){
    var html='<h2>package details</h2>';
    if(!pages.length)html+='<p class="small">Details will appear here soon.</p>';
    else html+='<p class="small">Jump to: '+pages.map(function(p){return '<a href="#/package" data-jump="pg-'+esc(p.slug)+'">'+esc(p.title)+'</a>'}).join(' · ')+'</p>';
    pages.forEach(function(p){
      html+='<div class="card" id="pgc-'+esc(p.slug)+'"><div class="bar"></div><div class="in"><h3 style="margin-top:0">'+esc(p.title)+(isAdmin()&&!p.published?' <span class="chip">hidden</span>':'')+'</h3>'
       +(isAdmin()?'<textarea id="pg-'+esc(p.slug)+'" style="min-height:220px">'+esc(p.body_md)+'</textarea><label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" id="pp-'+esc(p.slug)+'" '+(p.published?'checked':'')+' style="width:auto;margin-top:5px"> Visible to Heidi</label><p style="margin-top:8px"><button class="btn sm" data-slug="'+esc(p.slug)+'">Save</button></p>':md(p.body_md))+'</div></div>';
    });
    setPage(html);
    $('#page').onclick=function(e){
      var j=e.target.closest('[data-jump]');if(j){e.preventDefault();var t=document.getElementById('pgc-'+j.dataset.jump.slice(3));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
      var b=e.target.closest('button[data-slug]');if(!b||!isAdmin())return;var s=b.dataset.slug;
      sb.from('ttwh_pages').update({body_md:$('#pg-'+s).value,published:$('#pp-'+s).checked}).eq('slug',s).then(must).then(function(){b.textContent='Saved'}).catch(fail)};
  });
}

/* ---------- Q&A ---------- */
var ATT_BUCKET='ttwh-attachments',ATT_MAX=10*1024*1024,ATT_ACCEPT='image/png,image/jpeg,image/gif,image/webp,.pdf,.doc,.docx,.txt,.csv,.xlsx';
function aboutText(t,courses,comps){
  var c=courses.find(function(x){return x.id===t.course_id}),k=comps.find(function(x){return x.id===t.component_id});
  if(!c)return '';return esc(c.title)+(k?' · '+esc(k.label):'');
}
function uploadFiles(files,messageId){
  var list=Array.prototype.slice.call(files||[]);
  if(list.length>5)return Promise.reject(new Error('Please attach up to 5 files at a time.'));
  for(var i=0;i<list.length;i++){if(list[i].size>ATT_MAX)return Promise.reject(new Error(list[i].name+' is over 10 MB.'))}
  return list.reduce(function(chain,f){return chain.then(function(){
    var ext=((f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,8))||'bin',path=messageId+'/'+crypto.randomUUID()+'.'+ext;
    return sb.storage.from(ATT_BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false}).then(function(r){
      if(r.error)throw r.error;
      return sb.from('ttwh_qa_attachments').insert({message_id:messageId,path:path,filename:f.name.slice(0,200),size_bytes:f.size,content_type:f.type||null}).then(must)})})},Promise.resolve());
}
function linkify(h){return h.replace(/(https?:\/\/[^\s<]+)/g,function(u){var t='';var m=u.match(/[.,;:!?)\]]+$/);if(m){t=m[0];u=u.slice(0,u.length-t.length)}return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'+t})}
function threadCard(t,msgs,atts,who,courses,comps){
  var about=aboutText(t,courses,comps),res=t.status==='resolved',adm=isAdmin();
  var last=msgs.length?msgs[msgs.length-1]:null;
  var body=msgs.map(function(m){var at=atts.filter(function(a){return a.message_id===m.id}),mine=m.author_id===S.user.id,nm=who[m.author_id]||'',cl=!!(m.author_id&&who['_role_'+m.author_id]==='client');
    return '<div class="gm" data-m="'+m.id+'"><div class="av'+(cl?' cl':'')+'" aria-hidden="true">'+esc((nm||'?').charAt(0).toUpperCase())+'</div><div class="bd2"><div><span class="nm">'+esc(nm)+'</span><span class="tm">'+fmtDate(m.created_at,true)+(m.edited_at?' · edited':'')+'</span>'+(mine&&!res?'<span class="ac"><a href="#" data-edit="'+m.id+'">Edit</a> · <a href="#" data-del="'+m.id+'">Delete</a></span>':'')+'</div><div class="mb">'+linkify(esc(m.body)).replace(/\n/g,'<br>')+'</div>'
     +(at.length?'<div style="margin-top:6px">'+at.map(function(a){return '<button class="btn sm alt" data-path="'+esc(a.path)+'" data-fn="'+esc(a.filename)+'">📎 '+esc(a.filename)+'</button> '}).join('')+'</div>':'')+'</div></div>'}).join('');
  var reply=res?'':'<form class="rf" data-t="'+t.id+'" style="margin-top:8px"><label>Reply</label><textarea required style="min-height:240px" placeholder="Write a reply"></textarea><input type="file" class="rfile" multiple accept="'+ATT_ACCEPT+'" aria-label="Attach files"><p style="margin-top:6px"><button class="btn sm" type="submit">Send</button></p></form>';
  var own=(t.created_by===S.user.id&&!res);
  var acts=(adm||own)?'<p style="margin-top:8px">'+(adm?(res?'<button class="btn sm alt" data-st="open" data-t="'+t.id+'">Reopen</button>':'<button class="btn sm go" data-st="resolved" data-t="'+t.id+'">Mark resolved (hides it from Heidi)</button>'):'')+(res&&!adm?'':' <button class="btn sm alt" data-delthread="'+t.id+'">Delete question</button>')+'</p>':'';
  var head='<b>'+esc(t.subject)+'</b> '+chip(t.status)+(about?' <span class="chip">About: '+about+'</span>':'')+' <span class="small">'+msgs.length+' message'+(msgs.length===1?'':'s')+(last?' · last '+fmtDate(last.created_at):'')+'</span>';
  return '<details class="card thread'+(res?' resolved':'')+'" id="th-'+t.id+'"'+(res?'':' open')+'><summary style="padding:10px 14px;cursor:pointer">'+head+'</summary><div class="in" style="padding:0 16px 14px">'+body+reply+acts+'</div></details>';
}
function pQA(id){
  return Promise.all([
    sb.from('ttwh_qa_threads').select('*').order('created_at',{ascending:false}),
    sb.from('ttwh_qa_messages').select('*').order('created_at'),
    sb.from('ttwh_qa_attachments').select('*'),
    sb.from('ttwh_profiles').select('*'),
    sb.from('ttwh_courses').select('id,title,position').order('position'),
    sb.from('ttwh_components').select('id,label,position').order('position')
  ]).then(function(r){
    var th=must(r[0]),ms=must(r[1]),at=must(r[2]),who={},courses=must(r[4]),comps=must(r[5]);must(r[3]).forEach(function(p){who[p.user_id]=p.display_name;who['_role_'+p.user_id]=p.role});
    var live=th.filter(function(t){return t.status!=='resolved'}),done=th.filter(function(t){return t.status==='resolved'});
    var card=function(t){var m=ms.filter(function(x){return x.thread_id===t.id}),ids=m.map(function(x){return x.id});return threadCard(t,m,at.filter(function(a){return ids.indexOf(a.message_id)>-1}),who,courses,comps)};
    var html='<h2>questions</h2><details class="card" id="newq"><summary style="padding:10px 14px;cursor:pointer"><b>＋ Ask a new question</b></summary><form id="qf" class="in" style="padding:0 16px 14px">'
     +'<label for="qc">What is it about? (optional)</label><select id="qc"><option value="">A general question</option>'+courses.map(function(c){return '<option value="'+c.id+'">'+c.position+'. '+esc(c.title)+'</option>'}).join('')+'</select>'
     +'<div id="qkw" hidden><label for="qk">Which component?</label><select id="qk"><option value="">The whole item / not sure</option>'+comps.map(function(k){return '<option value="'+k.id+'">'+esc(k.label)+'</option>'}).join('')+'</select></div>'
     +'<label for="qs">Subject</label><input id="qs" required><label for="qb">Your question</label><textarea id="qb" required style="min-height:240px"></textarea>'
     +'<label for="qa">Attach files (optional, up to 5, 10 MB each)</label><input id="qa" type="file" multiple accept="'+ATT_ACCEPT+'">'
     +'<p style="margin-top:10px"><button class="btn sm" type="submit">Post</button></p></form></details>';
    html+=live.length?live.map(card).join(''):'<p class="small" style="margin-top:12px">No open questions. Thank you!</p>';
    if(isAdmin()&&done.length)html+='<h3>resolved ('+done.length+')</h3><p class="small">Hidden from Heidi. Open one to read it or reopen it.</p>'+done.map(card).join('');
    setPage(html);
    if(id){var el=document.getElementById('th-'+id);if(el){el.open=true;el.scrollIntoView()}}
    $('#qc').onchange=function(){$('#qkw').hidden=!this.value;if(!this.value)$('#qk').value=''};
    $('#qf').onsubmit=function(e){e.preventDefault();var btn=$('#qf button');btn.disabled=true;
      sb.from('ttwh_qa_threads').insert({subject:$('#qs').value,course_id:$('#qc').value||null,component_id:$('#qc').value&&$('#qk').value?$('#qk').value:null}).select('id').single().then(must)
       .then(function(t){return sb.from('ttwh_qa_messages').insert({thread_id:t.id,body:$('#qb').value}).select('id').single().then(must).then(function(m){return uploadFiles($('#qa').files,m.id)}).catch(function(err){alert('Your question was posted, but the attachment failed: '+(err.message||err))}).then(function(){pQA(t.id)})})
       .catch(function(err){fail(err);btn.disabled=false})};
    var pg=$('#page');
    pg.onclick=function(e){
      var b=e.target.closest('button[data-path]');
      if(b){sb.storage.from(ATT_BUCKET).createSignedUrl(b.dataset.path,120,{download:b.dataset.fn}).then(function(x){if(x.error)return fail(x.error);window.open(x.data.signedUrl,'_blank','noopener')});return}
      var ed=e.target.closest('a[data-edit]');
      if(ed){e.preventDefault();var box=ed.closest('.gm'),mb=box.querySelector('.mb'),orig=ms.filter(function(x){return x.id===ed.dataset.edit})[0];
        mb.innerHTML='<textarea style="min-height:240px">'+esc(orig.body)+'</textarea><p style="margin-top:6px"><button class="btn sm go" data-save="'+orig.id+'">Save</button> <button class="btn sm alt" data-cancel="1">Cancel</button></p>';return}
      var sv=e.target.closest('button[data-save]');
      if(sv){var ta=sv.closest('.mb').querySelector('textarea').value.trim();if(!ta)return;sv.disabled=true;
        sb.from('ttwh_qa_messages').update({body:ta,edited_at:new Date().toISOString()}).eq('id',sv.dataset.save).then(must).then(function(){pQA(null)}).catch(function(err){fail(err);sv.disabled=false});return}
      if(e.target.closest('button[data-cancel]')){pQA(null);return}
      var dl=e.target.closest('a[data-del]');
      if(dl){e.preventDefault();if(!confirm('Delete this message? This cannot be undone.'))return;
        sb.from('ttwh_qa_messages').delete().eq('id',dl.dataset.del).then(must).then(function(){pQA(null)}).catch(fail);return}
      var dt=e.target.closest('button[data-delthread]');
      if(dt){e.preventDefault();if(!confirm('Delete this whole question and its replies? This cannot be undone.'))return;
        sb.from('ttwh_qa_threads').delete().eq('id',dt.dataset.delthread).then(must).then(function(){pQA(null)}).catch(fail);return}
      var s=e.target.closest('button[data-st]');
      if(s&&isAdmin()){e.preventDefault();var tid=s.dataset.t,v=s.dataset.st;s.disabled=true;
        sb.from('ttwh_qa_threads').update({status:v,resolved_at:v==='resolved'?new Date().toISOString():null}).eq('id',tid).then(must).then(function(){pQA(v==='open'?tid:null)}).catch(function(err){fail(err);s.disabled=false})}};
    pg.onsubmit=function(e){var f=e.target.closest('form.rf');if(!f)return;e.preventDefault();var btn=f.querySelector('button'),tid=f.dataset.t;btn.disabled=true;
      sb.from('ttwh_qa_messages').insert({thread_id:tid,body:f.querySelector('textarea').value}).select('id').single().then(must)
       .then(function(m){return uploadFiles(f.querySelector('.rfile').files,m.id).catch(function(err){alert('Your reply was sent, but the attachment failed: '+(err.message||err))})})
       .then(function(){pQA(tid)}).catch(function(err){fail(err);btn.disabled=false})};
  });
}

/* ---------- timer (admin only) ---------- */
function pTimer(){
  return sb.from('ttwh_time_entries').select('*').order('started_at',{ascending:false}).then(must).then(function(es){
    var running=es.find(function(e){return !e.ended_at});
    function total(){return es.reduce(function(a,e){return a+((e.ended_at?new Date(e.ended_at):new Date())-new Date(e.started_at))},0)}
    var html='<h2>project timer</h2><div class="card m"><div class="bar"></div><div class="in"><div class="small">Total time on this project</div><div class="timer" id="tt">'+hms(total())+'</div><p class="small">'+(total()/3600000).toFixed(2)+' hours · only you can see this page</p></div></div>'
     +'<div class="card"><div class="bar"></div><div class="in">'+(running?'<p><b>Running since '+fmtDate(running.started_at,true)+'</b></p><label for="tn">Note</label><input id="tn" value="'+esc(running.note||'')+'" placeholder="What did you work on?"><p style="margin-top:10px"><button class="btn go" id="stop">Stop timer</button></p>':'<label for="tn">What are you starting?</label><input id="tn" placeholder="e.g. Intro video edit"><p style="margin-top:10px"><button class="btn go" id="start">Start timer</button></p>')+'</div></div>'
     +'<h3>add time by hand</h3><form class="card" id="mf"><div class="bar"></div><div class="in"><div class="grid c3"><div><label>Date</label><input name="d" type="date" required></div><div><label>Minutes</label><input name="m" type="number" min="1" required></div><div><label>Note</label><input name="n"></div></div><p style="margin-top:10px"><button class="btn sm" type="submit">Add</button></p></div></form>'
     +'<h3>entries</h3>'+(es.length?es.map(function(e){var ms=(e.ended_at?new Date(e.ended_at):new Date())-new Date(e.started_at);return '<div class="row"><span>'+fmtDate(e.started_at,true)+' · <b>'+(e.ended_at?hms(ms):'running')+'</b> '+esc(e.note||'')+'</span><button class="btn sm alt" data-del="'+e.id+'">delete</button></div>'}).join(''):'<p class="small">Nothing logged yet.</p>');
    setPage(html);
    if(running)S.tick=setInterval(function(){var t=$('#tt');if(t)t.textContent=hms(total())},1000);
    var st=$('#start');if(st)st.onclick=function(){sb.from('ttwh_time_entries').insert({started_at:new Date().toISOString(),note:$('#tn').value||null}).then(must).then(pTimer).catch(fail)};
    var sp=$('#stop');if(sp)sp.onclick=function(){sb.from('ttwh_time_entries').update({ended_at:new Date().toISOString(),note:$('#tn').value||null}).eq('id',running.id).then(must).then(pTimer).catch(fail)};
    $('#mf').onsubmit=function(e){e.preventDefault();var f=e.target,s=new Date(f.d.value+'T09:00:00'),en=new Date(s.getTime()+Number(f.m.value)*60000);
      sb.from('ttwh_time_entries').insert({started_at:s.toISOString(),ended_at:en.toISOString(),note:f.n.value||null}).then(must).then(pTimer).catch(fail)};
    $('#page').onclick=function(e){var b=e.target.closest('[data-del]');if(!b||!confirm('Delete this entry?'))return;sb.from('ttwh_time_entries').delete().eq('id',b.dataset.del).then(must).then(pTimer).catch(fail)};
  });
}

boot();
})();
</script>
